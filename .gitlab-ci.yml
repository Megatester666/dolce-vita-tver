stages:
  - lint
  - test
  - frontend-test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - backend/.venv

.lint-backend-template: &lint-backend
  image: python:3.11
  stage: lint
  before_script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt || true
  script:
    - pip install flake8
    - flake8 backend || true

lint-backend:
  <<: *lint-backend
  only:
    - branches

test-backend:
  image: python:3.11
  stage: test
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - pytest -q backend
  artifacts:
    when: always
    paths:
      - backend/.pytest_cache

frontend-test:
  image: node:18
  stage: frontend-test
  cache:
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm test --silent || true
  only:
    - branches
